name: Build Firmware

# Push / pull request: compile check only.
# Run manually ("Run workflow"):
#   - on main, with a plain FW_VERSION ("0.2.0"): stable release, installed by OTA;
#   - on any branch, with a pre-release FW_VERSION ("0.2.0-beta.1"): GitHub pre-release,
#     never marked "latest", so OTA ignores it and testers flash it by hand.
on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md", "icons/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "icons/**", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP32_CORE_VERSION: 3.3.12
  ARDUINO_CLI_VERSION: 1.5.1
  SKETCH: ESP32_ePaper_GoogleCalendar

jobs:
  # --------------------------------------------------
  # Read FW_VERSION from the sketch, refuse a version already released
  # --------------------------------------------------
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read firmware version
        id: read
        run: |
          VERSION=$(sed -n 's/^#define FW_VERSION *"\([^"]*\)".*/\1/p' "$SKETCH.ino" | head -n 1)
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Could not read FW_VERSION from $SKETCH.ino (got '$VERSION')"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             git rev-parse -q --verify "refs/tags/firmware-$VERSION" >/dev/null; then
            echo "::error::firmware-$VERSION is already released: bump FW_VERSION in $SKETCH.ino"
            exit 1
          fi
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PRERELEASE" = false ] && \
             [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Stable versions are released from main only. For a beta, use FW_VERSION like $VERSION-beta.1"
            exit 1
          fi
          echo "Firmware version $VERSION (pre-release: $PRERELEASE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp32
            fqbn: esp32:esp32:esp32
            board-options: PartitionScheme=default
          - name: esp32c6
            fqbn: esp32:esp32:esp32c6
            board-options: PartitionScheme=default,CDCOnBoot=cdc

    steps:
      - uses: actions/checkout@v7

      - name: Cache Arduino packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
            ~/Arduino/libraries
          # Bump the version list here together with the installs below.
          key: arduino-${{ runner.os }}-esp32-${{ env.ESP32_CORE_VERSION }}-gxepd2-1.6.9-gfx-1.12.6-busio-1.17.4-json-7.4.3

      # arduino/setup-arduino-cli still runs on Node.js 20: use the official install script.
      - name: Setup Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit BusIO@1.17.4" \
            "GxEPD2@1.6.9" \
            "ArduinoJson@7.4.3"

      - name: Patch GxEPD2 for ESP32
        run: |
          sed -i 's|#include <avr/pgmspace.h>|#include <pgmspace.h>|' \
            ~/Arduino/libraries/GxEPD2/src/GxEPD2_EPD.cpp

      - name: Patch Adafruit_BusIO for ESP32 core 3.x
        run: |
          FILE="$HOME/Arduino/libraries/Adafruit_BusIO/Adafruit_SPIDevice.h"
          sed -i 's/SPI_BITORDER_MSBFIRST = SPI_MSBFIRST/SPI_BITORDER_MSBFIRST = MSBFIRST/' "$FILE"
          sed -i 's/SPI_BITORDER_LSBFIRST = SPI_LSBFIRST/SPI_BITORDER_LSBFIRST = LSBFIRST/' "$FILE"

      # The "default" partition scheme keeps two app slots, which GitHub OTA needs.
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --board-options "${{ matrix.board-options }}" \
            --warnings default \
            --export-binaries \
            --output-dir build \
            "./$SKETCH.ino" | tee compile.log
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Sketch uses|Global variables" compile.log >> "$GITHUB_STEP_SUMMARY" || true

      # Short names, so they read well on the release page:
      #   <board>-full.bin     complete image (bootloader + partitions + app), flash at 0x0
      #   <board>-ota.bin      app only, downloaded by the device for OTA
      #   <board>-version.txt  checked by the device before downloading
      # The firmware builds its OTA links from these names: keep them stable.
      - name: Package firmware
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BOARD: ${{ matrix.name }}
        run: |
          OUT="release/$BOARD"
          mkdir -p "$OUT"
          cp "build/$SKETCH.ino.merged.bin" "$OUT/$BOARD-full.bin"
          cp "build/$SKETCH.ino.bin"        "$OUT/$BOARD-ota.bin"
          printf "%s\n" "$VERSION" > "$OUT/$BOARD-version.txt"
          ls -l "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: release/${{ matrix.name }}
          retention-days: 90

  # --------------------------------------------------
  # Release only on a manual run, after ALL builds succeeded
  # --------------------------------------------------
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Collect release files
        run: |
          mkdir -p publish
          find release -type f \( -name "*.bin" -o -name "*-version.txt" \) -exec cp {} publish/ \;
          ls -l publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ESP32 ePaper Google Calendar ${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: publish/*
